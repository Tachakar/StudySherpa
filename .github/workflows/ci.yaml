name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studysherpa
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: test_db
        options:
          --health-cmd "pg_isready -U studysherpa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432


    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Copy .env variables
        run: cp .env.example .env
      - name: Install python
        run: uv python install
      - name: Sync
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "v22.22.2"
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run lint && npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copy .env variables
        run: cp .env.example .env
      - name: Build image and start app with dependencies
        run: docker compose up --build --detach --wait app
      - name: Smoke test
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --header "Accept: text/html" http://localhost:8000/login | grep --quiet '<div id="root">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/api/nope)" = "404"
      - name: Show container logs
        if: failure()
        run: docker compose logs
